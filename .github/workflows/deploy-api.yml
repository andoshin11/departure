name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "shared/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-node の cache: yarn は yarn を呼ぶため、先に Corepack を有効化して
      # packageManager で指定した Yarn 4 を使わせる（後にすると runner の Yarn 1 が使われ失敗する）
      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --immutable

      # Vite+（vp check）: Oxfmt のフォーマット確認 + Oxlint + 型チェック（tsgolint）を1回で行う
      - name: Check (format, lint, type check)
        run: yarn workspace @departure/api run check

      - name: Test
        run: yarn workspace @departure/api run test

      - name: Verify KV namespace id is configured
        run: |
          if grep -q "REPLACE_WITH_KV_NAMESPACE_ID" api/wrangler.jsonc; then
            echo "::error file=api/wrangler.jsonc::kv_namespaces[].id is still the placeholder. Create the KV namespace and replace it with the real id before deploying." >&2
            exit 1
          fi

      # account_id は wrangler.jsonc に書かず Secret から渡す。未設定のまま wrangler に渡すと
      # 原因の分かりにくいエラーになるため、先に明示的に検査する。
      - name: Verify Cloudflare secrets are configured
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets が設定されていません:$missing" >&2
            exit 1
          fi

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          command: deploy
